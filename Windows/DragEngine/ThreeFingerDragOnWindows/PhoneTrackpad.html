<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111820">
<title>3£ Trackpad</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#111820;color:#eef5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100vh;height:100dvh;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;overflow:hidden;overscroll-behavior:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:21px;letter-spacing:-.7px;margin:0}h1 span{font-weight:400;color:#acbbc7}
button{border:1px solid #3b4a58;background:#243340;color:#eef5fa;border-radius:14px;padding:15px 12px;font:600 16px system-ui;touch-action:manipulation;min-height:48px}button:active,button[aria-pressed=true]{background:#a8e5cd;color:#0e2420}button:disabled{opacity:.45}
#connect{font-size:14px;padding:10px 14px}#status{font-size:14px;line-height:1.4;color:#b9cbd8;min-height:20px;margin:0}
#pad{flex:1;min-height:90px;border:1px solid #344755;border-radius:26px;background:radial-gradient(circle at center,#1c2a35,#17222c);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pad.live{border-color:#67ae98}#pad.dragging{border:2px solid #a8e5cd;background:#203a38}
.hint{text-align:center;color:#aebecb;pointer-events:none;font-size:15px;line-height:1.85}.hint strong{display:block;color:#e0eaf0;font-size:19px;font-weight:500;margin-bottom:8px}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}footer{display:flex;align-items:center;gap:14px;font-size:14px;color:#b9cbd8}input{flex:1;min-width:50px;accent-color:#a8e5cd}#speedValue{min-width:34px}
</style>
</head>
<body>
<header><h1>3£ <span>Trackpad</span></h1><button id="connect">Connect</button></header>
<p id="status" role="status" aria-live="polite">Connecting to your laptop…</p>
<div id="pad" role="application" aria-label="Trackpad. Move one finger, scroll with two, drag with three.">
  <div class="hint"><strong>Your laptop, at your fingertips</strong>One finger to move · tap to click<br>Two fingers to scroll · tap to right-click<br>Three fingers to drag</div>
</div>
<div class="buttons"><button id="left" disabled>Left click</button><button id="drag" aria-pressed="false" disabled>Drag</button><button id="right" disabled>Right click</button></div>
<footer><label for="speed">Pointer speed</label><input id="speed" type="range" min="0.5" max="3" step="0.1" value="1.4"><span id="speedValue">1.4×</span></footer>
<script src="/pad.js"></script>
</body>
</html>
