name: Build and publish 3£Windows
on:
  push:
    branches: [main]
    paths: ['Windows/**', '.github/workflows/windows-releases.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Windows App Runtime for the compiled self-test
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe' -OutFile $installer
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid Microsoft runtime signature.' }
          $process = Start-Process $installer -ArgumentList '--quiet' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw 'Windows App Runtime installation failed.' }
      - name: Build both architectures and verify portable installer
        shell: pwsh
        run: ./Windows/build.ps1
      - name: Publish a new Windows version after successful validation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content Windows/version.json -Raw | ConvertFrom-Json).version
          $tag = "windows-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published; immutable assets retained. Increment Windows/version.json for the next release."
            exit 0
          }
          $artifacts = @(Get-ChildItem build/windows/release -File | ForEach-Object FullName)
          gh release create $tag @artifacts --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "3£Windows $version" --notes-file Windows/RELEASE.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows release publication failed.' }
