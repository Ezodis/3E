name: Phone trackpad and MIDI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Shared receiver, gestures and reconnect tests (no native input)
        run: |
          dotnet run --project Windows/PhoneTrackpadTests
          node Windows/PhoneTrackpadTests/gestures.test.cjs
          node Windows/PhoneTrackpadTests/trackpad.test.cjs
          node Windows/PhoneTrackpadTests/dock.test.cjs
          node Windows/PhoneTrackpadTests/watch.test.cjs
          node Windows/PhoneTrackpadTests/update.test.cjs
          node Windows/PhoneTrackpadTests/handoff.test.cjs
      - name: Browser tests (WebKit and Chromium against the preview receiver)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright-core" install webkit chromium
          dotnet build Windows/PhoneTrackpadTests -v q
          url="$RUNNER_TEMP/preview-url"
          dotnet run --no-build --project Windows/PhoneTrackpadTests -- --preview "$url" > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview=$!
          for i in $(seq 1 120); do [[ -s "$url" ]] && break; sleep 0.5; done
          if ! PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright-core" node Windows/PhoneTrackpadTests/browser.test.cjs "$url" "$RUNNER_TEMP/screens" > "$RUNNER_TEMP/browser.log" 2>&1; then
            cat "$RUNNER_TEMP/browser.log" "$RUNNER_TEMP/preview.log"
            # Surface the failure in the check summary (one annotation, newlines escaped).
            echo "::error title=Browser tests::$(tail -n 25 "$RUNNER_TEMP/browser.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            kill $preview; pkill -f -- '--preview' || true; exit 1
          fi
          cat "$RUNNER_TEMP/browser.log"
          kill $preview; pkill -f -- '--preview' || true
      - name: Build standalone universal Mac app
        run: zsh Shared/PhoneControl/MacHost/build-app.sh
      - name: Run receiver, CoreMIDI and pasteboard smoke tests
        run: |
          arch=$(uname -m)
          if [[ "$arch" == x86_64 ]]; then arch=x64; fi
          host="build/phone/3E Phone.app/Contents/Resources/PhoneControl/$arch/ThreeE.PhoneHost"
          "$host" --self-test
          "$host" --native-self-test
          "$host" --midi-self-test
          "$host" --clipboard-self-test
      - name: Build integrated Combined edition
        env:
          STRIP_SIGNING_IDENTITY: '-'
        run: |
          zsh TouchBar/musicstrip/Source/build.sh
          python3 -m unittest discover -s scripts -p test_release.py
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"scripts"); from release import verify_modules; verify_modules(Path("TouchBar/build/musicstrip/3E.app"),"combined")'
          ditto -c -k --sequesterRsrc --keepParent 'TouchBar/build/musicstrip/3E.app' build/phone/3E-Combined.zip
      - name: Touch Bar media handoff regression tests
        run: 'TouchBar/build/musicstrip/3E.app/Contents/MacOS/MusicStrip --self-test'
      - name: Existing native menu and app-switcher regression tests
        run: |
          xcrun clang -fobjc-arc -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/musicstrip/Tests/window_chooser.m -o /tmp/window-test
          /tmp/window-test
          xcrun clang -fobjc-arc -Wno-deprecated-declarations -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/musicstrip/Tests/apps_launcher_hold.m -o /tmp/apps-test
          /tmp/apps-test
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_COMBINED=1 -framework AppKit -framework CoreMIDI TouchBar/musicstrip/Tests/combined_menu.m -o /tmp/menu-test
          /tmp/menu-test
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_TOUCHBAR=1 -framework AppKit -framework ApplicationServices TouchBar/musicstrip/Tests/release_updates.m -o /tmp/release-updates-touchbar
          /tmp/release-updates-touchbar
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_COMBINED=1 -framework AppKit -framework ApplicationServices TouchBar/musicstrip/Tests/release_updates.m -o /tmp/release-updates-combined
          /tmp/release-updates-combined
      - uses: actions/upload-artifact@v4
        with:
          name: 3E-Phone-Mac
          path: build/phone/3E-Phone-Mac.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: 3E-Combined-Mac
          path: build/phone/3E-Combined.zip
          if-no-files-found: error
