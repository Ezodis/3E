name: Phone trackpad and MIDI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Shared receiver, gestures and reconnect tests (no native input)
        run: |
          dotnet run --project Windows/PhoneTrackpadTests
          node Windows/PhoneTrackpadTests/gestures.test.cjs
          node Windows/PhoneTrackpadTests/dock.test.cjs
          node Windows/PhoneTrackpadTests/watch.test.cjs
      - name: Build standalone universal Mac app
        run: zsh Shared/PhoneControl/MacHost/build-app.sh
      - name: Run receiver and CoreMIDI smoke tests
        run: |
          arch=$(uname -m)
          if [[ "$arch" == x86_64 ]]; then arch=x64; fi
          host="build/phone/3E Phone.app/Contents/Resources/PhoneControl/$arch/ThreeE.PhoneHost"
          "$host" --self-test
          "$host" --native-self-test
          "$host" --midi-self-test
      - name: Build integrated Combined edition
        env:
          STRIP_SIGNING_IDENTITY: '-'
        run: |
          zsh TouchBar/musicstrip/Source/build.sh
          python3 -m unittest discover -s scripts -p test_release.py
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"scripts"); from release import verify_modules; verify_modules(Path("TouchBar/build/musicstrip/3£.app"),"combined")'
          ditto -c -k --sequesterRsrc --keepParent 'TouchBar/build/musicstrip/3£.app' build/phone/3E-Combined.zip
      - name: Existing native menu and app-switcher regression tests
        run: |
          xcrun clang -fobjc-arc -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/musicstrip/Tests/window_chooser.m -o /tmp/window-test
          /tmp/window-test
          xcrun clang -fobjc-arc -Wno-deprecated-declarations -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/musicstrip/Tests/apps_launcher_hold.m -o /tmp/apps-test
          /tmp/apps-test
          xcrun clang -fobjc-arc -framework AppKit -framework CoreMIDI TouchBar/musicstrip/Tests/combined_menu.m -o /tmp/menu-test
          STRIP_COMBINED_TOUCHTAB=1 /tmp/menu-test
      - uses: actions/upload-artifact@v4
        with:
          name: 3E-Phone-Mac
          path: build/phone/3E-Phone-Mac.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: 3E-Combined-Mac
          path: build/phone/3E-Combined.zip
          if-no-files-found: error
