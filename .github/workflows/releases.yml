name: Build and publish 3E (Mac and Windows)
# One run builds every platform, so 3£Windows and the Mac base app share one version.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-releases
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [combined, touchbar, touchtab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stamp monotonically increasing versions
        run: python3 scripts/release.py stamp --offset "$GITHUB_RUN_NUMBER"
      - name: Build edition without installing or launching
        env:
          STRIP_SIGNING_IDENTITY: '-'
          TOUCHTAB_SIGNING_IDENTITY: '-'
          EDITION: ${{ matrix.edition }}
        run: |
          case "$EDITION" in
            combined) zsh TouchBar/musicstrip/Source/build.sh --combined ;;
            touchbar) zsh TouchBar/musicstrip/Source/build.sh --touchbar-only ;;
            touchtab) zsh TouchTab/build.sh ;;
          esac
      - name: Test maintained functionality without live app control
        run: |
          python3 -m unittest discover -s TouchBar/musicstrip/Tests -p test_record.py
          python3 -m unittest discover -s scripts -p test_release.py
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_TOUCHBAR=1 -framework AppKit -framework ApplicationServices TouchBar/musicstrip/Tests/release_updates.m -o /tmp/release-updates-touchbar
          /tmp/release-updates-touchbar
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_COMBINED=1 -framework AppKit -framework ApplicationServices TouchBar/musicstrip/Tests/release_updates.m -o /tmp/release-updates-combined
          /tmp/release-updates-combined
          xcrun clang -fobjc-arc -framework AppKit -framework ApplicationServices TouchBar/musicstrip/Tests/gesture_capabilities.m -o /tmp/gesture-test
          /tmp/gesture-test
          xcrun clang -fobjc-arc -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/musicstrip/Tests/window_chooser.m -o /tmp/window-test
          /tmp/window-test
          xcrun clang -fobjc-arc -Wno-deprecated-declarations -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/musicstrip/Tests/apps_launcher_hold.m -o /tmp/apps-hold-test
          /tmp/apps-hold-test
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_COMBINED=1 -framework AppKit -framework ApplicationServices -framework CoreMIDI TouchBar/musicstrip/Tests/combined_menu.m -o /tmp/menu-test
          /tmp/menu-test
      - name: Verify signatures, architectures and edition; package
        env:
          EDITION: ${{ matrix.edition }}
        run: python3 scripts/release.py package --edition "$EDITION" --offset "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}
          path: build/releases/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/releases
          merge-multiple: true
      - name: Publish only after all three editions pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --offset "$GITHUB_RUN_NUMBER"
  windows:
    # Same workflow run number as the Mac editions, so windows-vX.Y.Z == combined-vX.Y.Z.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stamp the shared 3E version
        shell: pwsh
        run: |
          python scripts/release.py stamp-windows --offset $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { throw 'Version stamping failed.' }
          Get-Content Windows/version.json
      - name: Install Windows App Runtime for the compiled self-test
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe' -OutFile $installer
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid Microsoft runtime signature.' }
          $process = Start-Process $installer -ArgumentList '--quiet' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw 'Windows App Runtime installation failed.' }
      - name: Build both architectures and verify portable installer
        shell: pwsh
        run: ./Windows/build.ps1
      - name: Publish the Windows build under the shared version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content Windows/version.json -Raw | ConvertFrom-Json).version
          $tag = "windows-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published; immutable assets retained."
            exit 0
          }
          $artifacts = @(Get-ChildItem build/windows/release -File | ForEach-Object FullName)
          gh release create $tag @artifacts --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "3£Windows $version" --notes-file Windows/RELEASE.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows release publication failed.' }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" > build/windows/published-release.json
          $report = Join-Path (Get-Location) 'build/windows/download-verification.json'
          $metadata = Join-Path (Get-Location) 'build/windows/published-release.json'
          $process = Start-Process -FilePath './build/windows/framework-x64/3£Windows.exe' -ArgumentList ('--verify-release "' + $metadata + '" "' + $report + '"') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw 'Published update download verification failed.' }
