name: Build and publish 3E (Mac and Windows)
# Every module shares one version line (release-versions.json base + run number).
# Only modules whose source changed since their last release are rebuilt and
# published, taking this run's version; unchanged modules keep their version.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-releases
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.plan.outputs.mac }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Find modules updated since their last release
        id: plan
        run: |
          plan=$(python3 scripts/release.py plan --offset "$GITHUB_RUN_NUMBER")
          echo "$plan"
          echo "mac=$(echo "$plan" | jq -c .mac)" >> "$GITHUB_OUTPUT"
          echo "windows=$(echo "$plan" | jq -r .windows)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.mac != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(needs.plan.outputs.mac) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stamp monotonically increasing versions
        run: python3 scripts/release.py stamp --offset "$GITHUB_RUN_NUMBER"
      - name: Build edition without installing or launching
        env:
          STRIP_SIGNING_IDENTITY: '-'
          TOUCHTAB_SIGNING_IDENTITY: '-'
          EDITION: ${{ matrix.edition }}
        run: |
          case "$EDITION" in
            combined) zsh TouchBar/threee/Source/build.sh --combined ;;
            touchbar) zsh TouchBar/threee/Source/build.sh --touchbar-only ;;
            touchtab) zsh TouchTab/build.sh ;;
            phone) zsh TouchBar/threee/Source/build.sh --phone-only ;;
          esac
      - name: Test maintained functionality without live app control
        run: |
          python3 -m unittest discover -s TouchBar/threee/Tests -p test_record.py
          python3 -m unittest discover -s scripts -p test_release.py
          if [[ "${{ matrix.edition }}" == combined ]]; then python3 TouchBar/threee/Tests/module_bundles.py; fi
          python3 Shared/PhoneControl/Ableton/test_mapping.py
          xcrun clang -fobjc-arc -framework AppKit -framework CoreImage -framework ApplicationServices TouchBar/threee/Tests/phone_recovery.m -o /tmp/phone-recovery-test
          /tmp/phone-recovery-test
          if [[ "${{ matrix.edition }}" == combined || "${{ matrix.edition }}" == phone ]]; then python3 Shared/PhoneControl/MacHost/test_recovery.py TouchBar/build/threee/3E.app; fi
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_TOUCHBAR=1 -framework AppKit -framework ApplicationServices TouchBar/threee/Tests/release_updates.m -o /tmp/release-updates-touchbar
          /tmp/release-updates-touchbar
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_COMBINED=1 -framework AppKit -framework ApplicationServices TouchBar/threee/Tests/release_updates.m -o /tmp/release-updates-combined
          /tmp/release-updates-combined
          xcrun clang -fobjc-arc -framework AppKit -framework ApplicationServices TouchBar/threee/Tests/gesture_capabilities.m -o /tmp/gesture-test
          /tmp/gesture-test
          xcrun clang -fobjc-arc -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/threee/Tests/window_chooser.m -o /tmp/window-test
          /tmp/window-test
          xcrun clang -fobjc-arc -Wno-deprecated-declarations -framework AppKit -framework Carbon -framework ApplicationServices -framework QuartzCore -framework CoreImage TouchBar/threee/Tests/apps_launcher_hold.m -o /tmp/apps-hold-test
          /tmp/apps-hold-test
          xcrun clang -fobjc-arc -DSTRIP_TEST_EDITION_COMBINED=1 -framework AppKit -framework ApplicationServices -framework CoreMIDI TouchBar/threee/Tests/combined_menu.m -o /tmp/menu-test
          /tmp/menu-test
      - name: Verify signatures, architectures and edition; package
        env:
          EDITION: ${{ matrix.edition }}
        run: python3 scripts/release.py package --edition "$EDITION" --offset "$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}
          path: build/releases/*
          if-no-files-found: error
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.mac != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/releases
          merge-multiple: true
      - name: Publish only after every updated edition passes
        env:
          GH_TOKEN: ${{ github.token }}
          EDITIONS: ${{ join(fromJSON(needs.plan.outputs.mac), ',') }}
        run: python3 scripts/release.py publish --offset "$GITHUB_RUN_NUMBER" --editions "$EDITIONS"
  windows:
    # Same run number as the Mac editions, so an updated Windows build gets this run's version.
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Stamp this run's shared 3E version
        shell: pwsh
        run: |
          python scripts/release.py stamp-windows --offset $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { throw 'Version stamping failed.' }
          Get-Content Windows/version.json
      - name: Install Windows App Runtime for the compiled self-test
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'WindowsAppRuntimeInstall-x64.exe'
          Invoke-WebRequest 'https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe' -OutFile $installer
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') { throw 'Invalid Microsoft runtime signature.' }
          $process = Start-Process $installer -ArgumentList '--quiet' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { throw 'Windows App Runtime installation failed.' }
      - name: Build both architectures and verify portable installer
        shell: pwsh
        run: ./Windows/build.ps1
      - name: Publish the Windows build under the shared version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content Windows/version.json -Raw | ConvertFrom-Json).version
          $tag = "windows-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published; immutable assets retained."
            exit 0
          }
          $artifacts = @(Get-ChildItem build/windows/release -File | ForEach-Object FullName)
          gh release create $tag @artifacts --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "3e $version" --notes-file Windows/RELEASE.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows release publication failed.' }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" > build/windows/published-release.json
          $report = Join-Path (Get-Location) 'build/windows/download-verification.json'
          $metadata = Join-Path (Get-Location) 'build/windows/published-release.json'
          $process = Start-Process -FilePath './build/windows/framework-x64/3e.exe' -ArgumentList ('--verify-release "' + $metadata + '" "' + $report + '"') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).passed) { throw 'Published update download verification failed.' }
